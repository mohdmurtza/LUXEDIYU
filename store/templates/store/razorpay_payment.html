<!-- store/templates/store/razorpay_payment.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - LUXEDIYU</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { 
            font-family: 'DM Sans', sans-serif; 
            background: #f5f5f5; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            margin: 0;
        }
        .payment-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h2 { margin-bottom: 20px; }
        .amount { 
            font-size: 36px; 
            font-weight: 700; 
            color: #d4af37;
            margin: 20px 0;
        }
        .btn-pay {
            background: #d4af37;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }
        .btn-pay:hover { background: #c9a227; }
    </style>
</head>
<body>

    <div class="payment-box">
        <h2>Complete Your Payment</h2>
        <p>Order Total</p>
        <div class="amount">₹{{ amount|floatformat:0 }}</div>
        
        <button class="btn-pay" id="payBtn">Pay Now</button>
    </div>

    <script>
        var options = {
            key: '{{ razorpay_key_id }}',
            amount: '{{ amount_paise }}',
            name: 'LUXEDIYU',
            description: 'Order Payment',
            image: 'https://your-logo-url.com/logo.png',
            handler: function(response) {
                // Payment successful
                fetch('/razorpay-success/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_signature: response.razorpay_signature
                    })
                }).then(function() {
                    window.location.href = '/order-confirmation/';
                });
            },
            prefill: {
                name: '{{ name }}',
                email: '{{ email }}',
                contact: '{{ phone }}'
            },
            theme: {
                color: '#d4af37'
            }
        };

        var rzp1 = new Razorpay(options);
        
        document.getElementById('payBtn').onclick = function() {
            rzp1.open();
        };
        
        // Auto open on page load
        rzp1.open();
    </script>

</body>
</html>
